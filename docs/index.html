<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Pop — today's tasks</title>
    <meta
      name="description"
      content="Floating bubbles for the shit you need to get done today."
    />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app">
      <header class="header">
        <div>
          <p class="logo">Pop</p>
          <p class="date" id="date-label"></p>
        </div>
        <div class="count-chip" id="count-chip" aria-live="polite">Clear</div>
      </header>

      <div id="empty" class="empty" hidden>
        <div class="empty-orb" aria-hidden="true"></div>
        <h2>Nothing floating</h2>
        <p>
          Add the shit you need to get done today. Unfinished ones stick around
          until you pop them.
        </p>
      </div>

      <div id="field" class="field" aria-label="Task bubbles"></div>

      <div id="add-dock" class="add-dock">
        <button type="button" class="add-fab" id="add-open">
          <span class="plus" aria-hidden="true">+</span>
          Add something
        </button>
      </div>

      <form id="add-form" class="add-form" hidden>
        <input
          id="add-input"
          type="text"
          maxlength="120"
          placeholder="What needs to get done?"
          autocomplete="off"
          enterkeyhint="done"
        />
        <button type="button" class="add-cancel" id="add-cancel">Close</button>
        <button type="submit" class="add-submit" id="add-submit" aria-label="Add task" disabled>
          +
        </button>
      </form>
    </main>

    <div id="confirm" class="confirm-backdrop" hidden>
      <div
        class="confirm-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
      >
        <p id="confirm-title" class="confirm-kicker">Mark done</p>
        <p class="confirm-text" id="confirm-text"></p>
        <p class="confirm-sub">Pop it and it's gone for good.</p>
        <div class="confirm-actions">
          <button type="button" class="btn-secondary" id="confirm-cancel">
            Cancel
          </button>
          <button type="button" class="btn-primary" id="confirm-yes">
            Pop it
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
